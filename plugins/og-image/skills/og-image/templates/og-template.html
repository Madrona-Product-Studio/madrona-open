<!doctype html>
<!--
  OG image template — 1200×630. Render to PNG with the `screenshot` skill:
    node tools/shot.mjs "file://<abs-path>/og-template.html" og.png 1200 630
  Edit the CSS variables, pick ONE archetype block below, delete the others.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #0b7d3b;          /* brand background color */
        --ink: #ffffff;         /* wordmark / text color   */
        --accent: #ffd34e;      /* at most one accent       */
        --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      .frame {
        width: 1200px; height: 630px; background: var(--bg); color: var(--ink);
        display: flex; align-items: center; justify-content: center;
        padding: 96px; font-family: var(--font);
      }
      /* Archetype A — wordmark on flat brand color (the default). */
      .wordmark { font-size: 128px; font-weight: 800; letter-spacing: -0.03em; }

      /* Archetype C — one statement + a small mark. Swap .frame content for this block. */
      .statement { max-width: 900px; }
      .statement .mark { font-size: 34px; font-weight: 800; opacity: 0.9; margin-bottom: 28px; }
      .statement h1 { font-size: 76px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
    </style>
  </head>
  <body>
    <!-- Archetype A: keep this, delete the statement block. -->
    <div class="frame">
      <div class="wordmark">Your&nbsp;Name</div>
    </div>

    <!-- Archetype C: uncomment, and delete the block above.
    <div class="frame">
      <div class="statement">
        <div class="mark">Your Name</div>
        <h1>One clear line about what this is.</h1>
      </div>
    </div>
    -->
  </body>
</html>
